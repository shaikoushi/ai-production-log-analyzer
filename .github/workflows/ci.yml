
name: Log Analyzer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest -v test_analyzer.py

      - name: Build Docker image
        run: docker build -t production-log-analyzer:v1 .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: production-log-analyzer:v1
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

